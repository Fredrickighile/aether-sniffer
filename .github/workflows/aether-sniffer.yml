# AETHER-SNIFFER — Automated Security Scan
# Scans the checked-out working tree for exposed secrets and Shadow AI
# endpoints, then fails the job if the scan finds CRITICAL issues or
# cannot finish.
#
# Exit codes from `aether-sniffer scan`:
#   0 = completed, no CRITICAL findings  -> job passes
#   1 = at least one CRITICAL finding     -> job fails
#   2 = scan incomplete (timeout/error)   -> job fails (never trusted as clean)
#
# Note: this scans the files in the checkout, not git history.
# To make a failing scan block merges, require the "Security Scan" check in
# Settings > Branches > branch protection rules.

name: AETHER-SNIFFER Security Scan

on:
  push:
    branches: ["**"]          # Scan every branch push
  pull_request:
    branches: [main, master]  # Scan PRs into main
  schedule:
    - cron: "0 2 * * 1"       # Weekly scan every Monday at 2am UTC
  workflow_dispatch:           # Allow manual trigger from GitHub UI

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout the repository ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Go ────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # ── 3. Install AETHER-SNIFFER ───────────────────────────────
      - name: Install AETHER-SNIFFER
        run: |
          git clone https://github.com/Fredrickighile/aether-sniffer.git /tmp/aether-sniffer
          cd /tmp/aether-sniffer
          go build -o /usr/local/bin/aether-sniffer .
          aether-sniffer --help

      # ── 4. Run the scan and record its exit code ────────────────
      # The report is written outside the checkout so the scan never reads it.
      - name: Run AETHER-SNIFFER scan
        id: scan
        run: |
          mkdir -p "$RUNNER_TEMP/aether-reports"
          set +e
          aether-sniffer scan . --output json --report-dir "$RUNNER_TEMP/aether-reports" > /dev/null 2> "$RUNNER_TEMP/scan-log.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/scan-log.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      # ── 5. Upload the JSON report as an artifact ────────────────
      - name: Upload scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-sniffer-report
          path: ${{ runner.temp }}/aether-reports/
          if-no-files-found: ignore
          retention-days: 90

      # ── 6. Post a summary to the Actions UI ─────────────────────
      - name: Post scan summary
        if: always()
        run: |
          code="${{ steps.scan.outputs.exit_code }}"
          {
            echo "## AETHER-SNIFFER Security Scan"
            echo ""
            case "$code" in
              0) echo "✅ **Scan completed. No CRITICAL findings.**" ;;
              1) echo "🔴 **CRITICAL findings detected. Gate blocked.**" ;;
              2) echo "⚠️ **Scan incomplete. Results cannot be trusted.**" ;;
              *) echo "⚠️ **Scan did not run correctly (exit code: ${code:-none}).**" ;;
            esac
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          REPORT=$(ls "$RUNNER_TEMP"/aether-reports/*.json 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then
            jq -r '"| Severity | Count |\n|---|---|\n| CRITICAL | \(.summary.by_severity.CRITICAL // 0) |\n| HIGH | \(.summary.by_severity.HIGH // 0) |\n| Total | \(.summary.total) |"' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 7. Security gate: trust the scan's exit code ────────────
      - name: Enforce security gate
        if: always()
        run: |
          code="${{ steps.scan.outputs.exit_code }}"
          case "$code" in
            0)
              echo "✔ Security gate passed: scan completed with no CRITICAL findings."
              ;;
            1)
              echo "✖ GATE BLOCKED: CRITICAL finding(s) detected. See the uploaded report for locations."
              exit 1
              ;;
            2)
              echo "✖ GATE BLOCKED: the scan did not complete, so the code cannot be called clean."
              exit 1
              ;;
            *)
              echo "✖ GATE BLOCKED: the scan did not run correctly (exit code: ${code:-none})."
              exit 1
              ;;
          esac